# Fly.io deployment for the shared DropoVPN relay at dropovpn.samuelnimoh.com.
# Deploy from the repository root (the image needs files from electron/ too):
#   fly deploy . --config relay/fly.toml --dockerfile relay/Dockerfile --ignorefile relay/Dockerfile.dockerignore --ha=false
# Keep exactly one machine: devices meet in one process's memory, so a second
# machine would split them into groups that cannot see each other.
app = "dropovpn-relay"
primary_region = "lhr"

[env]
  PORT = "8080"
  # Fly's proxy sets this header itself, so clients cannot forge it.
  DROPO_CLIENT_ADDRESS_HEADER = "fly-client-ip"
  DROPO_MAX_DEVICES = "2000"
  DROPO_MAX_PER_ADDRESS = "32"
  # 2 MB/s per device keeps the shared relay's bandwidth bounded.
  DROPO_DEVICE_RATE = "2097152"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 2500

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
