name: Stage verified installers in a draft release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Check and package DropoVPN run ID
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify build
        id: verify
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > /tmp/build.json
          jq -e '.conclusion == "success" and .name == "Check and package DropoVPN" and .head_branch == "main"' /tmp/build.json
          echo "sha=$(jq -r '.head_sha' /tmp/build.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.verify.outputs.sha }}
      - name: Verify the draft release for this version
        id: release
        env:
          SHA: ${{ steps.verify.outputs.sha }}
        run: |
          version=$(jq -r .version package.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "v$version" --json isDraft,targetCommitish | jq -e --arg sha "$SHA" '.isDraft == true and .targetCommitish == $sha'
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package corresponding runtime sources
        run: node scripts/package-runtime-sources.mjs
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: DropoVPN-*
          merge-multiple: true
          path: installers
      - name: Upload verified installers
        working-directory: installers
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          files=("DropoVPN-$VERSION-mac-arm64.dmg" "DropoVPN-$VERSION-mac-arm64.zip" "DropoVPN-$VERSION-win-x64.exe")
          for file in "${files[@]}"; do test -f "$file"; done
          sha256sum "${files[@]}" > INSTALLER-SHA256SUMS.txt
          gh release upload "v$VERSION" "${files[@]}" INSTALLER-SHA256SUMS.txt --clobber
      - name: Upload source archive and complete checksums
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cp installers/INSTALLER-SHA256SUMS.txt release/SHA256SUMS.txt
          cd release
          sha256sum "DropoVPN-$VERSION-runtime-sources.tar.gz" >> SHA256SUMS.txt
          gh release upload "v$VERSION" "DropoVPN-$VERSION-runtime-sources.tar.gz" SHA256SUMS.txt --clobber
